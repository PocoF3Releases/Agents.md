maintenance:
  current_state:
    update_when:
    - active task status changes
    - a pending runtime/build validation becomes verified
    - the authoritative branch/commit for active work changes
    do_not:
    - copy full subsystem histories
    - store speculative brainstorming
  index:
    update_when:
    - a new durable subsystem file is created
    - authoritative repository ownership changes
    - a primary today record changes
    do_not:
    - list every dated file
  repository_ledgers:
    update_when:
    - the user requests an AI contribution audit or refresh
    - repository/branch topology materially changes
    - a tracked AI-attributed commit is force-rewritten or removed
    source_of_truth: GitHub commit history
    index: memory/repositories/README.md
    tracked_heads: memory/repositories/TRACKED_HEADS.yaml
    normal_refresh: fetch branch heads only; inspect commit range only when a saved
      head changes
